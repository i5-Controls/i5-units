[project]
name = "i5-units"
version = "0.1.0"
description = "JSON unit registry, conversion, and dimensional quantities for i5"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i5_units"]

[tool.hatch.build.targets.sdist]
include = ["src/i5_units", "pyproject.toml"]

[dependency-groups]
dev = ["jsonschema>=4.26,<5", "pytest>=9.0.2", "ruff>=0.15.0", "ty>=0.0.15"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["i5_units"]
